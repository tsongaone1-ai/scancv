<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ ecv.name }} — ThriveCV</title>
</head>
<body style="font-family:system-ui;max-width:36rem;margin:2rem auto;padding:1rem;background:#f6f1e8;color:#0b1f33">
  <p><strong>ThriveCV</strong></p>
  <h1>{{ ecv.name }}</h1>
  <p>{{ ecv.city }}</p>
  <p>Skill: {{ ecv.skill }}</p>
  <img src="/s/{{ ecv.slug }}/qr.png" alt="QR code" width="180">
  <p>Scan opens this card.</p>
</body>
</html>
